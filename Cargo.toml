[package]
name = "titeny-backend-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.42.0", features = ["full"] }
sqlx = { version = "0.8.3", features = ["postgres", "runtime-tokio-rustls", "migrate"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
tower = "0.5.2"
tracing = "0.1.40"
tracing-subscriber = "0.3.19"
